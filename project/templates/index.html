{% extends "base.html" %}
{% block body %}
<p class="text-secondary">Write a thought. Share an update. Find it later.</p>
{% if session.logged_in %}
<section class="card border-0 shadow-sm p-4 mt-4">
  <h2 class="h5 mb-3">New entry</h2>
  <form action="{{ url_for('add_entry') }}" method="post" class="add-entry">
    <label for="title" class="form-label">Title</label>
    <input id="title" name="title" class="form-control mb-3" required>
    <label for="text" class="form-label">Text</label>
    <textarea id="text" name="text" rows="4" class="form-control mb-3" required></textarea>
    <button class="btn btn-primary" type="submit">Share</button>
  </form>
</section>
{% endif %}
{% set empty_message = "No entries yet. Add some!" %}
{% include "_entries.html" %}
{% endblock %}
