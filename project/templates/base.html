<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flaskr · ECE444{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="container py-5">
      <header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div><p class="eyebrow mb-1">ECE444 · PRA6</p><h1 class="mb-0"><a href="{{ url_for('index') }}">Flaskr</a></h1></div>
        <nav class="d-flex gap-2" aria-label="Main navigation">
          <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Home</a>
          <a class="btn btn-outline-primary" href="{{ url_for('search') }}">Search</a>
          {% if session.logged_in %}
          <a class="btn btn-outline-secondary" href="{{ url_for('logout') }}">log out</a>
          {% else %}
          <a class="btn btn-primary" href="{{ url_for('login') }}">log in</a>
          {% endif %}
        </nav>
      </header>
      {% for message in get_flashed_messages() %}
      <div class="flash alert alert-success" role="status">{{ message }}</div>
      {% endfor %}
      {% block body %}{% endblock %}
      <footer class="mt-5 pt-3 text-secondary small border-top">A small blog built with Flask, SQLAlchemy, and test-driven development.</footer>
    </main>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
