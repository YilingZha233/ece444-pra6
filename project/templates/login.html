{% extends "base.html" %}
{% block title %}Login · Flaskr{% endblock %}
{% block body %}
<section class="card border-0 shadow-sm p-4 login-card">
  <h2 class="h4 mb-3">Login</h2>
  {% if error %}<p class="alert alert-danger" role="alert"><strong>Error:</strong> {{ error }}</p>{% endif %}
  <form action="{{ url_for('login') }}" method="post">
    <label for="username" class="form-label">Username</label>
    <input id="username" name="username" autocomplete="username" class="form-control mb-3" required>
    <label for="password" class="form-label">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" class="form-control mb-3" required>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</section>
{% endblock %}
